<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vestuario | Alas de mi Patria</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .barra {
            background: #222;
            color: white;
            padding: 20px;
        }

        .barra h1 {
            margin: 0;
            font-size: 22px;
        }

        .barra p {
            margin-bottom: 0;
            color: #ccc;
        }

        .contenido {
            padding: 25px;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .numero {
            font-size: 35px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="barra">
        <h1>Alas de mi Patria</h1>
        <p>Gestión de Vestuario</p>
    </header>

    <main class="contenido">

        <h2>Panel principal</h2>

        <p>
            Sistema de gestión de vestuario del
            Ballet Folclórico Alas de mi Patria.
        </p>

        <section class="tarjetas">

            <div class="tarjeta">
                <h3>Vestuarios</h3>
                <div class="numero">0</div>
                <p>Registrados</p>
            </div>

            <div class="tarjeta">
                <h3>Disponibles</h3>
                <div class="numero">0</div>
                <p>Actualmente</p>
            </div>

            <div class="tarjeta">
                <h3>Préstamos</h3>
                <div class="numero">0</div>
                <p>Activos</p>
            </div>

            <div class="tarjeta">
                <h3>Reparaciones</h3>
                <div class="numero">0</div>
                <p>Pendientes</p>
            </div>

        </section>

    </main>

</body>
</html>
